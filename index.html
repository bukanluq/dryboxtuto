<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.1 &nbsp;System Overview</h2>
<p class="lede">We're building a humidity-controlled enclosure: a sensor reads the air, the ESP32 decides whether to run a humidifier and a vent fan, shows the reading on a small screen, and — unlike a typical standalone Arduino project — also publishes its status to the internet so it can be checked from any phone or laptop, on any network.</p>
<h3>Why the cloud matters here</h3>
<p>A plain microcontroller project is only visible to someone standing next to it, or on the same WiFi network. We add one more layer — a cloud database — specifically so <strong>monitoring works from anywhere</strong>, which is the whole point of the companion webapp you'll also build.</p>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.2 &nbsp;Architecture Diagram</h2>
<div class="flow">
<div class="node"><span class="t">SENSOR</span>DHT11<br>Humidity Input</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">CONTROLLER</span>ESP32<br>Reads &amp; Decides</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">OUTPUT</span>Relay + Fan<br>Physical Action</div>
</div>
<div class="flow">
<div class="node"><span class="t">CONTROLLER</span>ESP32</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">NETWORK</span>WiFi &rarr; HTTPS</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">CLOUD</span>Supabase<br>(Database)</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">APP</span>Webapp<br>(Any Device)</div>
</div>
<p class="footnote">Two independent loops: the local control loop (top) runs every second regardless of network state. The cloud reporting loop (bottom) runs every few seconds and only needs WiFi — if it fails, local control is unaffected.</p>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.3 &nbsp;End-to-End Data Flow</h2>
<ol class="steps">
<li><strong>Sensor read.</strong> The ESP32 asks the DHT11 for a humidity reading once per second.</li>
<li><strong>Decision.</strong> The ESP32 compares the reading against thresholds (below 45% / above 55%) and decides whether the humidifier and fan should be on or off.</li>
<li><strong>Local output.</strong> The ESP32 writes to the relay (humidifier) and fan pins, and updates the LCD screen.</li>
<li><strong>Cloud push.</strong> Every 5 seconds, the ESP32 sends its current status as JSON to a Supabase database table over HTTPS.</li>
<li><strong>Webapp read.</strong> The webapp, running on any phone or laptop, polls that same database row every few seconds.</li>
<li><strong>Display.</strong> The webapp shows humidity, humidifier state, and fan state, and marks the device "offline" if no update has arrived recently.</li>
</ol>
<div class="callout"><strong>Key idea —</strong> The webapp never talks to the ESP32 directly. It only talks to Supabase. The ESP32 only talks to Supabase too. This "push, don't pull" design is what makes monitoring work from any network — more on why in section 1.5.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.4 &nbsp;Hardware at a Glance</h2>
<table>
<tr><th>Component</th><th>Role</th><th>Interface</th></tr>
<tr><td>ESP32 development board</td><td>Main controller — runs all logic, WiFi, and the cloud connection</td><td>—</td></tr>
<tr><td>DHT11</td><td>Measures relative humidity (and temperature, unused here)</td><td>Single-wire digital</td></tr>
<tr><td>16×2 LCD with I2C backpack</td><td>Shows device ID and live humidity on-device</td><td>I2C</td></tr>
<tr><td>Relay or transistor module</td><td>Switches the humidifier on/off (ESP32 GPIO can't drive it directly)</td><td>Digital GPIO</td></tr>
<tr><td>Fan / vent actuator</td><td>Ventilates the enclosure when humidity is high</td><td>Digital GPIO</td></tr>
</table>
<p class="dim">Each component is covered in detail on the following slides, including exact pins, voltages, and common mistakes.</p>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.4.1 &nbsp;Hardware — ESP32 Development Board</h2>
<div class="two-col">
<div>
<p>The ESP32 is a microcontroller with <strong>built-in WiFi</strong>, which is why it's used here instead of a plain Arduino Uno — the cloud-reporting feature in Part 1.2 requires it.</p>
<h3>Specifications</h3>
<ul>
<li>Operating voltage: <strong>3.3V logic</strong> (GPIO pins are <strong>not</strong> 5V tolerant)</li>
<li>Typically powered via USB (5V in, regulated to 3.3V on-board)</li>
<li>Has built-in WiFi (802.11 b/g/n) used for all cloud communication</li>
</ul>
</div>
<div class="panel">
<div class="panel-title">Common mistakes</div>
<ul style="margin:0;">
<li>Feeding 5V directly into a GPIO pin — this can damage the board.</li>
<li>Not selecting the correct board variant under <code>Tools &gt; Board</code> before uploading.</li>
<li>Using a USB cable that is power-only (no data lines).</li>
</ul>
</div>
</div>
<div class="callout danger"><strong>Strapping pins —</strong> GPIO 0, 2, 5, 12, and 15 affect the ESP32's boot mode. This project uses <strong>GPIO 2</strong> (fan) and <strong>GPIO 5</strong> (humidifier) — both strapping pins. They work fine as regular outputs once the board has booted, but anything wired to them can glitch briefly <em>during</em> boot/reset, and a device pulling GPIO 2 high at boot can interfere with flashing. Keep this in mind if you swap pins later.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.4.2 &nbsp;Hardware — DHT11 Humidity Sensor</h2>
<div class="two-col">
<div>
<p>A low-cost digital sensor that reports humidity (and temperature) over a single data wire using its own timing-based protocol — not I2C or SPI.</p>
<h3>Specifications</h3>
<ul>
<li>Humidity range: 20–90% RH, accuracy ±5%</li>
<li>Supply voltage: 3.3V–5.5V</li>
<li><strong>Maximum sampling rate: 1 reading per second</strong> — this is exactly why the code reads it once every 1000ms, not faster</li>
<li>Data pin needs a pull-up resistor (10kΩ) to the supply voltage if you're using a bare sensor; most 3-pin breakout modules already include it</li>
</ul>
</div>
<div class="panel">
<div class="panel-title">Wiring (this project)</div>
<table style="margin:0;">
<tr><th>DHT11 Pin</th><th>ESP32 Pin</th></tr>
<tr><td>VCC</td><td>3.3V</td></tr>
<tr><td>GND</td><td>GND</td></tr>
<tr><td>DATA</td><td><code>GPIO 4</code></td></tr>
</table>
</div>
</div>
<div class="callout"><strong>Common mistake —</strong> Reading faster than once per second returns stale or garbage values — the sensor simply can't sample that quickly. If you see repeated checksum errors, this is the first thing to check.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.4.3 &nbsp;Hardware — 16×2 I2C LCD</h2>
<div class="two-col">
<div>
<p>A character display controlled over I2C via a small <strong>PCF8574</strong> "backpack" chip soldered to the back — this is what turns 16 individual control wires into just two (SDA/SCL).</p>
<h3>Specifications</h3>
<ul>
<li>I2C address is almost always <strong>0x27</strong> or <strong>0x3F</strong> depending on the backpack chip variant</li>
<li>On a standard ESP32 dev board, the default I2C pins are <strong>SDA = GPIO 21</strong>, <strong>SCL = GPIO 22</strong></li>
<li>Has an on-board contrast potentiometer — if the screen looks blank or all-black blocks, adjust this first</li>
</ul>
</div>
<div class="panel">
<div class="panel-title">Wiring (this project)</div>
<table style="margin:0;">
<tr><th>LCD Pin</th><th>ESP32 Pin</th></tr>
<tr><td>VCC</td><td>5V (VIN)</td></tr>
<tr><td>GND</td><td>GND</td></tr>
<tr><td>SDA</td><td><code>GPIO 21</code></td></tr>
<tr><td>SCL</td><td><code>GPIO 22</code></td></tr>
</table>
</div>
</div>
<div class="callout danger"><strong>Safety consideration —</strong> Most I2C LCD backpacks run at 5V and pull the SDA/SCL lines up to 5V. ESP32 GPIO pins are only rated for 3.3V. In practice this is widely used anyway in hobby projects, but the safer option — if your backpack allows it — is powering the LCD from 3.3V instead of 5V to keep the whole I2C bus at a safe voltage. If the display is unreliable or you want to be cautious, use a logic-level shifter on SDA/SCL.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.4.4 &nbsp;Hardware — Humidifier &amp; Fan Outputs</h2>
<p>The ESP32 cannot power a humidifier or fan motor directly — GPIO pins can only supply a few milliamps. Both outputs are switched through a <strong>relay module or transistor driver</strong>, with the ESP32 only sending the small on/off control signal.</p>
<table>
<tr><th>Output</th><th>ESP32 Pin</th><th>Driven via</th><th>Logic</th></tr>
<tr><td>Humidifier</td><td><code>GPIO 5</code></td><td>Relay / transistor module</td><td>HIGH = on, LOW = off (in this code)</td></tr>
<tr><td>Fan</td><td><code>GPIO 2</code></td><td>Relay / transistor module</td><td>HIGH = on, LOW = off (in this code)</td></tr>
</table>
<div class="callout danger"><strong>Safety —</strong> If the humidifier or fan is a motor (inductive load), always use a driver module with a flyback diode, or one that already includes one (most relay modules do). Driving a motor directly from a bare transistor with no diode can destroy the transistor and potentially the ESP32 pin when the motor switches off.</div>
<div class="callout"><strong>Common mistake —</strong> Confusing active-HIGH and active-LOW relay modules. Some relay boards turn <em>on</em> when the signal pin goes LOW. If your relay behaves backwards from what the Serial Monitor reports, this is almost always why — check your specific module's datasheet.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.5 &nbsp;Software Overview</h2>
<table>
<tr><th>Layer</th><th>What it is</th><th>Why it's used</th></tr>
<tr><td>Arduino IDE + ESP32 core</td><td>Compiles and uploads the firmware</td><td>Standard, well-supported toolchain for ESP32</td></tr>
<tr><td>ESP32 firmware (.ino)</td><td>Reads the sensor, controls outputs, runs WiFi setup, pushes status</td><td>Runs entirely on the device, no PC required after upload</td></tr>
<tr><td>Supabase</td><td>Hosted Postgres database + REST API</td><td>Free tier, no server to manage, reachable over HTTPS from anywhere</td></tr>
<tr><td>Webapp (HTML/JS)</td><td>Register devices, view live status, manage photos</td><td>Works on any phone/laptop with a browser — no app install</td></tr>
<tr><td>Vercel (or similar)</td><td>Hosts the webapp as a public HTTPS link</td><td>Free static hosting, one link to share</td></tr>
</table>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.6 &nbsp;Libraries &amp; Dependencies</h2>
<table>
<tr><th>Library</th><th>Used for</th><th>Install as</th></tr>
<tr><td><code>DHT11</code></td><td>Reading the humidity sensor</td><td>Library Manager → search exactly <code>"DHT11"</code> (by dhrubasaha08)</td></tr>
<tr><td><code>LiquidCrystal_I2C</code></td><td>Driving the I2C LCD</td><td>Library Manager → search <code>"LiquidCrystal I2C"</code> (by Frank de Brabander)</td></tr>
<tr><td><code>Wire</code></td><td>I2C bus support</td><td>Built into the ESP32 core — no install needed</td></tr>
<tr><td><code>WiFi</code>, <code>WebServer</code>, <code>Preferences</code>, <code>HTTPClient</code>, <code>WiFiClientSecure</code></td><td>WiFi, local config server, saved settings, HTTPS requests</td><td>All built into the ESP32 core — no install needed</td></tr>
<tr><td><code>@supabase/supabase-js</code> v2</td><td>Talking to Supabase from the webapp</td><td>Loaded via CDN in the webapp's HTML — no install needed</td></tr>
</table>
<div class="callout"><strong>Watch out —</strong> There are several different Arduino libraries with very similar names for the DHT11 (an older one uses <code>&lt;dht11.h&gt;</code>, lowercase, with a completely different API: <code>DHT.read(pin)</code>). If your code won't compile against the method names in this deck, you likely installed the wrong one — uninstall it and search for the exact name above.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.7 &nbsp;Communication Methods Used</h2>
<table>
<tr><th>Method</th><th>Where it's used</th><th>Notes</th></tr>
<tr><td>Single-wire digital</td><td>ESP32 ↔ DHT11</td><td>Custom timing-based protocol, not a standard bus</td></tr>
<tr><td>I2C</td><td>ESP32 ↔ LCD</td><td>2-wire (SDA/SCL), address 0x27 or 0x3F</td></tr>
<tr><td>GPIO digital output</td><td>ESP32 → relay/fan</td><td>Simple HIGH/LOW signal</td></tr>
<tr><td>WiFi</td><td>ESP32 ↔ router/hotspot</td><td>Required for any cloud feature</td></tr>
<tr><td>HTTP (local)</td><td>Browser ↔ ESP32's own setup page</td><td>Only used during WiFi setup, on the same network</td></tr>
<tr><td>HTTPS / REST</td><td>ESP32 → Supabase, Webapp ↔ Supabase</td><td>The actual monitoring path — works over the internet, not just local WiFi</td></tr>
</table>
<h3>Example: what the ESP32 actually sends</h3>
<div class="code-label">HTTPS POST to Supabase every 5 seconds</div>
<pre><span class="tok-com">POST /rest/v1/device_status?on_conflict=device_id</span>
<span class="tok-com">Headers: apikey, Authorization, Prefer: resolution=merge-duplicates</span>
{
  <span class="tok-str">"device_id"</span>: <span class="tok-str">"A1B2C3"</span>,
  <span class="tok-str">"humidity"</span>: <span class="tok-str">52</span>,
  <span class="tok-str">"humidity_valid"</span>: <span class="tok-kw">true</span>,
  <span class="tok-str">"humidifier_on"</span>: <span class="tok-kw">false</span>,
  <span class="tok-str">"fan_on"</span>: <span class="tok-kw">false</span>
}</pre>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.8 &nbsp;What Happens When Communication Fails</h2>
<div class="grid2">
<div class="panel">
<div class="panel-title">WiFi connection fails</div>
<p style="margin:0;">After a 15-second timeout, the ESP32 gives up on the saved network and starts its own setup Access Point (<code>ESP32-Setup-&lt;ID&gt;</code>) so it can be reconfigured. Sensor readings and local relay/fan control <strong>keep working</strong> the whole time — only the cloud push is affected.</p>
</div>
<div class="panel">
<div class="panel-title">Cloud push fails</div>
<p style="margin:0;">The HTTP response code is printed to Serial Monitor for debugging. The next attempt happens automatically 5 seconds later — nothing needs to be restarted. Local control is completely unaffected.</p>
</div>
<div class="panel">
<div class="panel-title">Webapp can't reach Supabase</div>
<p style="margin:0;">The fetch fails, the webapp shows the item as "Offline," and tries again on the next poll a few seconds later.</p>
</div>
<div class="panel">
<div class="panel-title">Device stops pushing (powered off)</div>
<p style="margin:0;">Its last database row simply stops updating. The webapp checks the row's timestamp and marks it "Offline" once it's gone stale, even though the old data is technically still sitting there.</p>
</div>
</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.9 &nbsp;Code Structure</h2>
<div class="flow">
<div class="node"><span class="t">INPUT</span>readAndControl-<br>Humidity()</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">PROCESSING</span>Threshold logic<br>in loop()</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">COMMUNICATION</span>pushStatus-<br>ToSupabase()</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">OUTPUT</span>LCD + relay<br>+ fan + cloud</div>
</div>
<table>
<tr><th>Function</th><th>Responsibility</th></tr>
<tr><td><code>setup()</code></td><td>Runs once: pin modes, LCD init, compute device ID, start WiFi</td></tr>
<tr><td><code>loop()</code></td><td>Runs forever: handles web server requests, triggers sensor reads every 1s, triggers cloud pushes every 5s — all using non-blocking timers (<code>millis()</code>), never <code>delay()</code>, so nothing stalls the others</td></tr>
<tr><td><code>readAndControlHumidity()</code></td><td>Reads the DHT11, updates the LCD, decides relay/fan state</td></tr>
<tr><td><code>pushStatusToSupabase()</code></td><td>Builds the JSON payload and sends it via HTTPS</td></tr>
<tr><td><code>connectWithSavedCredentials()</code> / <code>startAPMode()</code></td><td>WiFi provisioning — covered next</td></tr>
</table>
<div class="callout good"><strong>Key pattern —</strong> Using <code>millis()</code> timers instead of <code>delay()</code> is what lets the sensor read, the cloud push, and the local web server all happen "at the same time" on a single-threaded microcontroller. This is one of the most important habits to learn from this codebase.</div>
</section>

<section class="slide" data-part="Part 1 — How Everything Works">
<h2>1.10 &nbsp;WiFi Provisioning Flow</h2>
<p>The device never has WiFi credentials hardcoded. The first time it boots (or after a reset), it has no saved network, so it creates its own temporary Access Point for you to configure it from any phone or laptop.</p>
<div class="flow">
<div class="node"><span class="t">BOOT</span>Check saved<br>WiFi (flash)</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">FOUND?</span>Try connecting<br>(15s timeout)</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">SUCCESS</span>Run normally<br>+ push to cloud</div>
</div>
<div class="flow">
<div class="node" style="border-color:var(--warn);"><span class="t" style="color:var(--warn);">NOT FOUND / FAILED</span>Start Access Point<br><code>ESP32-Setup-&lt;ID&gt;</code></div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">USER</span>Visits setup page,<br>picks a network</div>
<div class="arrow">&rarr;</div>
<div class="node"><span class="t">SAVE</span>Credentials saved<br>to flash, reboots</div>
</div>
<p class="footnote">Credentials are stored using the ESP32's <strong>Preferences</strong> library, which writes to a reserved flash partition (NVS — Non-Volatile Storage) that survives power loss and reboots.</p>
</section>

<section class="slide" data-part="Part 2 — Learn, Test, Understand">
<h2>2.1 &nbsp;Basic Concepts You Need First</h2>
<div class="grid2">
<div>
<h3>Electronics</h3>
<ul>
<li><strong>Digital vs analog</strong> — a digital signal is only HIGH or LOW (0V or 3.3V); analog varies continuously. Everything in this project is digital.</li>
<li><strong>Input vs output</strong> — a sensor is an input (the ESP32 reads it); a relay/fan is an output (the ESP32 controls it).</li>
<li><strong>Sensor</strong> — converts a physical quantity (humidity) into an electrical signal.</li>
<li><strong>Actuator</strong> — converts an electrical signal into physical action (fan spinning, relay switching).</li>
</ul>
</div>
<div>
<h3>Programming</h3>
<ul>
<li><strong>Variable</strong> — a named storage slot, e.g. <code>lastHumidity</code>.</li>
<li><strong>Function</strong> — a named, reusable block of code, e.g. <code>readAndControlHumidity()</code>.</li>
<li><strong>Condition</strong> (<code>if</code>/<code>else</code>) — branches the code based on a true/false check.</li>
<li><strong>Loop</strong> — the <code>loop()</code> function itself runs forever, automatically, after <code>setup()</code> finishes once.</li>
</ul>
</div>
</div>
<h3>Networking (just enough to follow this project)</h3>
<ul>
<li><strong>Microcontroller</strong> — a small computer on a single chip (the ESP32) that runs one program forever, with no operating system.</li>
<li><strong>REST API</strong> — a way for two programs to talk over HTTP using plain URLs and JSON data, which is how the ESP32 talks to Supabase.</li>
<li><strong>JSON</strong> — a simple text format for structured data, e.g. <code>{"humidity": 52}</code>.</li>
</ul>
</section>

<section class="slide" data-part="Part 2 — Learn, Test, Understand">
<h2>Test 2 — Read the DHT11</h2>
<div class="panel"><div class="panel-title">Objective</div>Confirm the sensor is wired correctly and the library is installed correctly.</div>
<div class="panel"><div class="panel-title">Wiring</div>DHT11 DATA → <code>GPIO 4</code>, VCC → 3.3V, GND → GND.</div>
<div class="code-label">Code</div>
<pre><span class="tok-kw">#include</span> &lt;DHT11.h&gt;
DHT11 dht11(<span class="tok-str">4</span>);

<span class="tok-kw">void</span> <span class="tok-fn">setup</span>() { Serial.<span class="tok-fn">begin</span>(<span class="tok-str">115200</span>); }

<span class="tok-kw">void</span> <span class="tok-fn">loop</span>() {
  <span class="tok-kw">int</span> humidity = dht11.<span class="tok-fn">readHumidity</span>();
  <span class="tok-kw">if</span> (humidity != DHT11::ERROR_CHECKSUM &amp;&amp; humidity != DHT11::ERROR_TIMEOUT) {
    Serial.<span class="tok-fn">println</span>(humidity);
  } <span class="tok-kw">else</span> {
    Serial.<span class="tok-fn">println</span>(DHT11::<span class="tok-fn">getErrorString</span>(humidity));
  }
  <span class="tok-fn">delay</span>(<span class="tok-str">1000</span>); <span class="tok-com">// DHT11 can't be read faster than 1x/sec</span>
}</pre>
<div class="grid2">
<div class="panel"><div class="panel-title">Expected result</div>A humidity percentage (roughly 30–70% indoors) prints once per second.</div>
<div class="panel"><div class="panel-title">Troubleshooting</div>Constant checksum errors → check the pull-up resistor / wiring; try a different GPIO; confirm you installed <code>DHT11</code> by dhrubasaha08, not a different DHT library.</div>
</div>
</section>

<section class="slide" data-part="Part 2 — Learn, Test, Understand">
<h2>Phase 1 — Sensor + Serial</h2>
<p class="dim">Goal: read humidity reliably, once per second, with error handling.</p>
<pre class="tall"><span class="tok-kw">#include</span> &lt;DHT11.h&gt;
DHT11 dht11(<span class="tok-str">4</span>);
<span class="tok-kw">unsigned</span> <span class="tok-kw">long</span> lastReadMs = <span class="tok-str">0</span>;
<span class="tok-kw">const</span> <span class="tok-kw">unsigned</span> <span class="tok-kw">long</span> READ_INTERVAL_MS = <span class="tok-str">1000</span>;

<span class="tok-kw">void</span> <span class="tok-fn">setup</span>() {
  Serial.<span class="tok-fn">begin</span>(<span class="tok-str">115200</span>);
}

<span class="tok-kw">void</span> <span class="tok-fn">loop</span>() {
  <span class="tok-kw">unsigned</span> <span class="tok-kw">long</span> now = <span class="tok-fn">millis</span>();
  <span class="tok-kw">if</span> (now - lastReadMs &gt;= READ_INTERVAL_MS) {
    lastReadMs = now;
    <span class="tok-kw">int</span> humidity = dht11.<span class="tok-fn">readHumidity</span>();
    <span class="tok-kw">if</span> (humidity != DHT11::ERROR_CHECKSUM &amp;&amp; humidity != DHT11::ERROR_TIMEOUT) {
      Serial.<span class="tok-fn">println</span>(humidity);
    }
  }
}</pre>
<div class="callout good"><strong>New here —</strong> Notice <code>millis()</code> is used instead of <code>delay(1000)</code> — this is the non-blocking timing pattern used throughout the final code, introduced early so it's second nature by the time the project needs several timers at once.</div>

<section class="slide" data-part="Part 2 — Learn, Test, Understand">
<h2>Final Phase — Add Supabase Cloud Push</h2>
<p class="dim">Goal: report status to the cloud every 5 seconds, without blocking anything else. <span class="dim">(Additions to Phase 3 highlighted.)</span></p>
<pre class="tall"><span class="tok-com">// + added:</span>
<span class="tok-kw">#include</span> &lt;HTTPClient.h&gt;
<span class="tok-kw">#include</span> &lt;WiFiClientSecure.h&gt;

<span class="tok-kw">unsigned</span> <span class="tok-kw">long</span> lastPushMs = <span class="tok-str">0</span>;
<span class="tok-kw">const</span> <span class="tok-kw">unsigned</span> <span class="tok-kw">long</span> PUSH_INTERVAL_MS = <span class="tok-str">5000</span>;

<span class="tok-kw">void</span> <span class="tok-fn">loop</span>() {
  server.<span class="tok-fn">handleClient</span>();              <span class="tok-com">// from Phase 3</span>

  <span class="tok-kw">unsigned</span> <span class="tok-kw">long</span> now = <span class="tok-fn">millis</span>();
  <span class="tok-kw">if</span> (now - lastSensorReadMs &gt;= SENSOR_READ_INTERVAL_MS) {
    lastSensorReadMs = now;
    <span class="tok-fn">readAndControlHumidity</span>();         <span class="tok-com">// from Phase 2</span>
  }

  <span class="tok-com">// + added: a THIRD independent timer, same millis() pattern</span>
  <span class="tok-kw">if</span> (!apMode &amp;&amp; now - lastPushMs &gt;= PUSH_INTERVAL_MS) {
    lastPushMs = now;
    <span class="tok-fn">pushStatusToSupabase</span>();
  }
}</pre>
<div class="callout good"><strong>This is the full picture —</strong> three independent, non-blocking timers sharing one <code>loop()</code>. This exact structure is the final code in Part 3.</div>
</section>

<section class="slide" data-part="Part 3 — Replicate the Project">
<h2>3.6 &nbsp;Final Code — ESP32 Sketch (1 of 3)</h2>
<div class="code-label">File: <code>esp32_humidity_controller.ino</code> &nbsp;·&nbsp; Board: any ESP32-WROOM DevKit &nbsp;·&nbsp; Fill in <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> before uploading</div>
<pre class="tall">#include &lt;DHT11.h&gt;
#include &lt;Wire.h&gt;
#include &lt;LiquidCrystal_I2C.h&gt;
#include &lt;WiFi.h&gt;
#include &lt;WebServer.h&gt;
#include &lt;Preferences.h&gt;
#include &lt;HTTPClient.h&gt;
#include &lt;WiFiClientSecure.h&gt;

LiquidCrystal_I2C led(0x27,16,2);
DHT11 dht11(4);                    // DATA on GPIO 4

const int humidifierPin = 5;
const int fanPin = 2;
bool isDoorOpen = false;           // tracks fan state
bool humidifierIsOn = false;       // mirrors humidifier relay state

const char* SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const char* SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const char* STATUS_TABLE = "device_status";

unsigned long lastPushMs = 0;
const unsigned long PUSH_INTERVAL_MS = 5000;

String DEVICE_ID = "";
Preferences preferences;

void computeDeviceId() {
    uint64_t mac = ESP.getEfuseMac();
    char idBuf[7];
    sprintf(idBuf, "%06X", (uint32_t)(mac & 0xFFFFFFUL));
    DEVICE_ID = String(idBuf);
}

void pushStatusToSupabase() {
    if (WiFi.status() != WL_CONNECTED) return;
    WiFiClientSecure client;
    client.setInsecure();
    HTTPClient http;
    String url = String(SUPABASE_URL) + "/rest/v1/" + STATUS_TABLE + "?on_conflict=device_id";
    if (!http.begin(client, url)) { Serial.println("Supabase push: failed to begin request"); return; }
    http.addHeader("apikey", SUPABASE_ANON_KEY);
    http.addHeader("Authorization", String("Bearer ") + SUPABASE_ANON_KEY);
    http.addHeader("Content-Type", "application/json");
    http.addHeader("Prefer", "resolution=merge-duplicates,return=minimal");
    String json = "{";
    json += "\"device_id\":\"" + DEVICE_ID + "\",";
    json += "\"humidity\":" + String(lastHumidityValid ? lastHumidity : -1) + ",";
    json += "\"humidity_valid\":" + String(lastHumidityValid ? "true" : "false") + ",";
    json += "\"humidifier_on\":" + String(humidifierIsOn ? "true" : "false") + ",";
    json += "\"fan_on\":" + String(isDoorOpen ? "true" : "false");
    json += "}";
    int httpCode = http.POST(json);
    if (httpCode > 0 && httpCode < 300) { Serial.println("Supabase push OK"); }
    else { Serial.print("Supabase push failed, code: "); Serial.println(httpCode); Serial.println(http.getString()); }
    http.end();
}</pre>
</section>

<section class="slide" data-part="Part 3 — Replicate the Project">
<h2>3.6 &nbsp;Final Code — ESP32 Sketch (2 of 3)</h2>
<div class="code-label">Continued — WiFi provisioning (saved credentials, AP fallback, setup page, optional fixed IP)</div>
<pre class="tall">WebServer server(80);
const char* AP_SSID_PREFIX = "ESP32-Setup-";
const char* AP_PASSWORD = "";
bool apMode = false;
const unsigned long WIFI_CONNECT_TIMEOUT_MS = 15000;
unsigned long lastSensorReadMs = 0;
const unsigned long SENSOR_READ_INTERVAL_MS = 1000;
int lastHumidity = -1;
bool lastHumidityValid = false;

void handleStatusPage() {
    String html = "&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta name='viewport' content='width=device-width, initial-scale=1'&gt;";
    html += "&lt;title&gt;ESP32 Monitor&lt;/title&gt;&lt;/head&gt;&lt;body style='font-family:Arial;padding:20px;'&gt;";
    html += "&lt;h2&gt;Device Online&lt;/h2&gt;";
    html += "&lt;p&gt;Device ID: &lt;b&gt;" + DEVICE_ID + "&lt;/b&gt;&lt;/p&gt;";
    html += "&lt;p&gt;Humidity: " + String(lastHumidityValid ? String(lastHumidity) + " %" : "--") + "&lt;/p&gt;";
    html += "&lt;p&gt;Status pushes to the cloud every " + String(PUSH_INTERVAL_MS / 1000) + "s automatically.&lt;/p&gt;";
    html += "&lt;p&gt;&lt;a href='/forget-wifi' style='color:#d9483b;'&gt;Forget WiFi &amp;amp; reset&lt;/a&gt;&lt;/p&gt;";
    html += "&lt;/body&gt;&lt;/html&gt;";
    server.send(200, "text/html", html);
}

void handleForgetWifi() {
    preferences.begin("wifi", false);
    preferences.clear();
    preferences.end();
    server.send(200, "text/html", "&lt;h3&gt;WiFi cleared. Restarting...&lt;/h3&gt;");
    delay(1500);
    ESP.restart();
}

bool connectOnce(const String&amp; ssid, const String&amp; password, unsigned long timeoutMs) {
    WiFi.begin(ssid.c_str(), password.c_str());
    unsigned long start = millis();
    while (WiFi.status() != WL_CONNECTED &amp;&amp; millis() - start &lt; timeoutMs) { delay(250); Serial.print("."); }
    Serial.println();
    return WiFi.status() == WL_CONNECTED;
}

bool connectWithSavedCredentials() {
    preferences.begin("wifi", true);
    String ssid = preferences.getString("ssid", "");
    String password = preferences.getString("password", "");
    String staticOctetStr = preferences.getString("octet", "");
    preferences.end();
    if (ssid.length() == 0) { Serial.println("No saved WiFi credentials found."); return false; }
    WiFi.mode(WIFI_STA);
    if (!connectOnce(ssid, password, WIFI_CONNECT_TIMEOUT_MS)) { return false; }
    if (staticOctetStr.length() &gt; 0) {
        int octet = staticOctetStr.toInt();
        if (octet &gt;= 2 &amp;&amp; octet &lt;= 254) {
            IPAddress gateway = WiFi.gatewayIP();
            IPAddress subnet = WiFi.subnetMask();
            IPAddress dns = WiFi.dnsIP();
            IPAddress staticIP(gateway[0], gateway[1], gateway[2], octet);
            WiFi.disconnect(true, false);
            delay(300);
            WiFi.config(staticIP, gateway, subnet, dns);
            if (!connectOnce(ssid, password, 10000)) {
                WiFi.config(IPADDR_NONE, IPADDR_NONE, IPADDR_NONE);
                connectOnce(ssid, password, WIFI_CONNECT_TIMEOUT_MS);
            }
        }
    }
    return WiFi.status() == WL_CONNECTED;
}</pre>

<section class="slide" data-part="Part 3 — Replicate the Project">
<h2>3.6 &nbsp;Final Code — ESP32 Sketch (3 of 3)</h2>
<div class="code-label">Continued — sensor control loop and the combined <code>setup()</code> / <code>loop()</code></div>
<pre class="tall">void readAndControlHumidity() {
    int humidity = dht11.readHumidity();
    led.setCursor(0,1); led.print("RH: "); led.print(humidity); led.print("%   ");
    led.setCursor(0,0); led.print("ID: " + DEVICE_ID);

    if (humidity != DHT11::ERROR_CHECKSUM &amp;&amp; humidity != DHT11::ERROR_TIMEOUT) {
        lastHumidity = humidity;
        lastHumidityValid = true;
    } else {
        Serial.println(DHT11::getErrorString(humidity));
        lastHumidityValid = false;
        return;
    }

    if (humidity &lt; 45) {
        if (isDoorOpen) { digitalWrite(fanPin, LOW); isDoorOpen = false; }
        digitalWrite(humidifierPin, HIGH);
        humidifierIsOn = true;
    }
    else if (humidity &gt; 55) {
        if (!isDoorOpen) { digitalWrite(fanPin, HIGH); isDoorOpen = true; }
        digitalWrite(humidifierPin, LOW);
        humidifierIsOn = false;
    }
    else {
        if (isDoorOpen) { digitalWrite(fanPin, LOW); isDoorOpen = false; }
        digitalWrite(humidifierPin, LOW);
        humidifierIsOn = false;
    }
}

void setupWiFi() {
    if (connectWithSavedCredentials()) { apMode = false; server.begin(); }
    else { apMode = true; WiFi.mode(WIFI_AP);
           WiFi.softAP((String(AP_SSID_PREFIX) + DEVICE_ID).c_str()); server.begin(); }
}

void setup() {
    Serial.begin(115200);
    pinMode(humidifierPin, OUTPUT);
    pinMode(fanPin, OUTPUT);
    led.init();
    led.backlight();
    computeDeviceId();
    setupWiFi();
}

void loop() {
    server.handleClient();
    unsigned long now = millis();
    if (now - lastSensorReadMs &gt;= SENSOR_READ_INTERVAL_MS) {
        lastSensorReadMs = now;
        readAndControlHumidity();
    }
    if (!apMode &amp;&amp; now - lastPushMs &gt;= PUSH_INTERVAL_MS) {
        lastPushMs = now;
        pushStatusToSupabase();
    }
}</pre>

<h2>3.7 &nbsp;Supabase Table Setup (SQL)</h2>
<div class="code-label">Run once in Supabase → SQL Editor</div>
<pre class="tall">create table device_status (
  device_id text primary key,
  humidity integer,
  humidity_valid boolean,
  humidifier_on boolean,
  fan_on boolean,
  updated_at timestamptz default now()
);

alter table device_status enable row level security;

create policy "Public can read device status" on device_status
  for select using (true);
create policy "Public can insert device status" on device_status
  for insert with check (true);
create policy "Public can update device status" on device_status
  for update using (true) with check (true);

-- Keeps updated_at accurate on every push, not just the first insert
create or replace function set_updated_at()
returns trigger as $$
begin
  new.updated_at = now();
  return new;
end;
$$ language plpgsql;

create trigger device_status_set_updated_at
before insert or update on device_status
for each row execute function set_updated_at();</pre>
<div class="callout"><strong>Security note —</strong> These policies make the table publicly readable/writable by anyone holding the project's anon key. That's acceptable for a classroom/personal project but is <strong>not</strong> suitable for storing private data — a production system would add real authentication.</div>

<script>
const tpl = document.getElementById('slides-template');
const deck = document.getElementById('deck');
deck.appendChild(tpl.content.cloneNode(true));

const slides = Array.from(document.querySelectorAll('.slide'));
let current = 0;

const jumpSelect = document.getElementById('jump');
slides.forEach((s, i) => {
    const opt = document.createElement('option');
    const h = s.querySelector('h1, h2');
    opt.textContent = (i+1) + '. ' + (h ? h.textContent.replace(/\u00a0/g,' ') : s.dataset.part);
    jumpSelect.appendChild(opt);
});

function render(){
    slides.forEach((s, i) => s.classList.toggle('active', i === current));
    document.getElementById('slideCounter').textContent = (current+1) + ' / ' + slides.length;
    document.getElementById('partLabel').textContent = slides[current].dataset.part || '';
    document.getElementById('progressBar').style.width = (((current+1)/slides.length)*100) + '%';
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === slides.length - 1;
    jumpSelect.selectedIndex = current;
    slides[current].scrollTop = 0;
    try { localStorage.setItem('handover-deck-slide', String(current)); } catch(e) {}
}

function goTo(i){
    if (i < 0 || i >= slides.length) return;
    current = i;
    render();
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { goTo(current+1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { goTo(current-1); e.preventDefault(); }
});

let startX = null;
document.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 60) { dx < 0 ? goTo(current+1) : goTo(current-1); }
    startX = null;
}, {passive:true});

(function restore(){
    try {
        const saved = parseInt(localStorage.getItem('handover-deck-slide'), 10);
        if (!isNaN(saved) && saved >= 0 && saved < slides.length) current = saved;
    } catch(e) {}
    render();
})();
</script>
